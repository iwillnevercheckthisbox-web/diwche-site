# nginx drops every inherited add_header the moment a location declares one of
# its own, so these have to be re-included in each location that sets caching.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# Turnstile is the proof-of-human on the public read. It is the only third-party
# origin the site is allowed to reach, and the page loads nothing from it at all
# until a site key is configured.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://challenges.cloudflare.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
