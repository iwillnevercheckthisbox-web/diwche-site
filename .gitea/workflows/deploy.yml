name: Build-and-Deploy-Diwche-Site

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Disable SSL verification (INSECURE)
        run: git config --global http.sslVerify false

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          github-server-url: https://git.helabyte.com
          token: ${{ secrets.GITHUB_TOKEN }}
          set-safe-directory: true

      # The site is built inside the Dockerfile (node:22-alpine stage), so there
      # is no Node setup step here. One toolchain, identical locally and in CI.

      - name: Set image vars
        id: vars
        run: |
          IMAGE_REPO=$(echo "git.helabyte.com/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="${{ github.sha }}"
          echo "image=${IMAGE_REPO}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE_REPO}:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login git.helabyte.com \
            -u "${{ vars.REGISTRY_USER }}" \
            --password-stdin

      # The base images come from Docker Hub, and the runner's DNS resolver has been
      # answering SERVFAIL for registry-1.docker.io — "server misbehaving" from
      # 192.168.1.1. It is intermittent, and when it hits, BuildKit cannot even read
      # the image metadata, so the build dies before the first layer and the deploy is
      # skipped silently. Pulling them first, with retries, turns a transient DNS
      # failure into a slower build instead of a lost deploy.
      - name: Pull base images
        run: |
          for image in node:22-alpine nginx:alpine; do
            ok=""
            for attempt in 1 2 3 4; do
              if docker pull "$image"; then ok="yes"; break; fi
              echo "Could not pull $image (attempt $attempt) — retrying in 10s"
              sleep 10
            done
            if [ -z "$ok" ]; then
              # Not fatal on its own: an image already on this host builds fine without
              # the registry. The build below is what decides.
              echo "::warning::Could not pull $image; relying on whatever is cached locally"
            fi
          done

      - name: Build and push Docker image
        run: |
          # PUBLIC_READ=on builds the funnel at /read and points the hero CTA at it.
          # Off, the page still exists and still walks, but carries a preview banner and
          # nothing links to it. Turned on now that /api/public/* is served and a source
          # account can be nominated in Admin.
          #
          # BuildKit is off for this one build so that a base image already on the host is
          # used as-is. BuildKit resolves metadata from the registry even when the image is
          # cached, which is exactly the call that fails when DNS is unwell.
          # The Turnstile site key is deliberately *not* passed here. It used to
          # arrive as `vars.TURNSTILE_SITE_KEY`, and when that variable was never
          # set the build arg was passed as an empty string — which overrides the
          # Dockerfile's default rather than falling back to it. The page then
          # minted no token, and the backend, which does hold a secret, refused
          # every read. The key is public, so it lives in the Dockerfile now.
          DOCKER_BUILDKIT=0 docker build --build-arg PUBLIC_READ=on \
            -t "${{ steps.vars.outputs.image }}" .
          docker tag "${{ steps.vars.outputs.image }}" "${{ steps.vars.outputs.latest }}" || true
          docker push "${{ steps.vars.outputs.image }}"
          docker push "${{ steps.vars.outputs.latest }}" || true

      - name: Deploy to NAS
        uses: https://github.com/appleboy/ssh-action@master
        # READ_GATE travels as an environment variable rather than being pasted
        # into the script text. It is chosen by a person, so it may contain a
        # quote or a backslash, and a secret interpolated into a shell command
        # can break the command around it — which here means the old container is
        # already gone and the new one never starts.
        env:
          READ_GATE: ${{ secrets.READ_GATE }}
          # Empty unless the Gitea variable is set; the image then keeps its own default.
          API_UPSTREAM: ${{ vars.API_UPSTREAM }}
        with:
          envs: READ_GATE,API_UPSTREAM
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          password: ${{ secrets.SSH_PASS }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            TARGET_IMAGE=$(echo "git.helabyte.com/${{ github.repository }}:${{ github.sha }}" | tr '[:upper:]' '[:lower:]')

            echo "Logging in to registry..."
            echo "${{ secrets.REGISTRY_TOKEN }}" | docker login git.helabyte.com \
              -u "${{ vars.REGISTRY_USER }}" \
              --password-stdin

            echo "Pulling new image..."
            docker pull "$TARGET_IMAGE"

            # Checked before anything is torn down. The value is substituted into
            # an nginx directive, where a bare quote or backslash makes the config
            # invalid and the container refuses to start — and by then the site is
            # already off the air. Refusing the deploy costs nothing; finding out
            # after the swap costs the site.
            case "$READ_GATE" in
              *'"'*|*'\'*|*'$'*)
                echo "READ_GATE contains a double quote, a backslash or a dollar sign."
                echo "The first two make the nginx config invalid; a dollar sign can be eaten by"
                echo "envsubst, which would change the header silently and refuse every read."
                echo "Use letters, digits and dashes."
                exit 1
                ;;
            esac

            # Same reasoning: the value lands in a proxy_pass directive, and a bad one
            # is only discovered after the old container is gone.
            if [ -n "$API_UPSTREAM" ]; then
              case "$API_UPSTREAM" in
                http://*|https://*) ;;
                *) echo "API_UPSTREAM must start with http:// or https:// (got '$API_UPSTREAM')."; exit 1 ;;
              esac
              UPSTREAM_ARG="-e API_UPSTREAM=$API_UPSTREAM"
            else
              UPSTREAM_ARG=""
            fi

            echo "Stopping old container..."
            docker stop diwche-site || true
            docker rm   diwche-site || true

            echo "Freeing port 5659 if anything else holds it..."
            OWNER=$(docker ps --filter "publish=5659" --format "{{.Names}}" 2>/dev/null || true)
            if [ -n "$OWNER" ]; then
              echo "Stopping container holding port 5659: $OWNER"
              docker stop "$OWNER" || true
              docker rm   "$OWNER" || true
            fi

            echo "Starting new container on port 5659..."
            docker run -d \
              --name diwche-site \
              --restart always \
              -p 5659:80 \
              -e READ_GATE="$READ_GATE" \
              $UPSTREAM_ARG \
              "$TARGET_IMAGE"

            echo "Waiting for nginx..."
            OK=""
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:5659/healthz >/dev/null 2>&1; then
                echo "Healthy after ${i}s."
                OK=1
                break
              fi
              sleep 1
            done
            if [ -z "$OK" ]; then
              echo "Site did not answer /healthz within 15s:"
              docker logs --tail 40 diwche-site || true
              exit 1
            fi

            echo "Smoke-checking the homepage..."
            curl -fsS -o /dev/null http://127.0.0.1:5659/

            docker ps -f "name=diwche-site"

            echo "Cleaning old images..."
            docker image prune -af || true

            echo "Deployment complete."
