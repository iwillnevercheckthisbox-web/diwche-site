<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Diwche's horns — the locked anatomy, not a letterform. Redrawn as the ram's
       curl the current mascot art carries, and the left one still sits a touch
       lower than the right, per the character bible.

       The ground follows the reader's theme. A favicon cannot see the site's own
       toggle, so it goes on the system preference, which is what the toggle
       starts from anyway. -->
  <style>
    .ground { fill: #05070C; }
    @media (prefers-color-scheme: light) { .ground { fill: #F7F6F2; } }
  </style>
  <rect class="ground" width="32" height="32" rx="7"/>
  <g fill="none" stroke="#C9A668" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17.6 12.2c4-3 9-1.2 8.9 4-0.1 3.6-3.2 5.6-4.9 3.8-1.2-1.3-0.5-3.2 1.2-3"/>
    <path d="M14.4 13c-4-3-9-1.2-8.9 4 0.1 3.6 3.2 5.6 4.9 3.8 1.2-1.3 0.5-3.2-1.2-3"/>
  </g>
</svg>
